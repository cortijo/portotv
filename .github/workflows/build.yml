name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner do GitHub já vem com um Android SDK pronto (ANDROID_HOME) e
      # licenças aceitas. Não usamos a action android-actions/setup-android
      # porque, ao detectar a versão do cmdline-tools "errada", ela baixa uma
      # nova e tenta reaceitar as licenças de forma interativa — sem terminal
      # para responder "y", o passo trava e falha. Aqui aceitamos as licenças
      # nós mesmos, sem interação, e instalamos só a plataforma que falta.
      - name: Aceitar licenças e instalar a plataforma do Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar debug
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: portonet-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
